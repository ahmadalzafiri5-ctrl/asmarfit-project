# Baut bei jeder Aenderung an der App automatisch die Android-App (APK).
# Ergebnis: Actions -> (Lauf anklicken) -> unten "Artifacts" -> ASFIT-android-apk
#
# Damit sich eine neue APK ueber die alte installieren laesst (ohne Deinstallieren, Daten bleiben),
# muss sie mit demselben Schluessel signiert sein. Dafuer einmal das Secret DEBUG_KEYSTORE_BASE64 anlegen
# (Anleitung steht in frontend/ANDROID-UPDATES.md). Ohne das Secret baut der Lauf trotzdem, aber mit
# einem frischen Schluessel pro Lauf: dann die alte App vorher deinstallieren.
name: Android-App bauen

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/basics.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      store:
        description: "Store-Variante bauen (ohne Einnahme-Tagebuch)"
        type: boolean
        default: false

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Der Android-SDK ist auf den GitHub-Rechnern schon installiert; hier nur die Lizenzen bestaetigen
      - name: Android-SDK pruefen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Web-App bauen und in das Android-Projekt kopieren
        working-directory: frontend
        env:
          VITE_HIDE_INTAKE: ${{ inputs.store && '1' || '' }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Feste Signatur einsetzen (wenn das Secret vorhanden ist)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 fehlt: die APK bekommt einen neuen Schluessel und laesst sich nicht ueber eine schon installierte App spielen."
            exit 0
          fi
          mkdir -p ~/.android
          # Leerzeichen, Zeilenumbrueche und Anfuehrungszeichen vom Kopieren und Einfuegen werden entfernt (es wird nichts vom Inhalt ausgegeben)
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d ' \r\n\t"' > /tmp/ks.b64
          echo "Secret gefunden: $(wc -c < /tmp/ks.b64) Zeichen"
          if base64 -d /tmp/ks.b64 > ~/.android/debug.keystore 2>/dev/null && keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "Feste Signatur aus dem Secret wird verwendet."
          else
            rm -f ~/.android/debug.keystore
            echo "::warning::Das Secret DEBUG_KEYSTORE_BASE64 ist kein gueltiger Debug-Schluessel (Base64 nicht lesbar, oder Alias androiddebugkey mit Passwort android nicht gefunden). Der Bau laeuft mit einem frischen Schluessel weiter."
          fi
          rm -f /tmp/ks.b64

      - name: Versionsnummer hochzaehlen
        run: |
          echo "ASFIT_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ASFIT_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Google Play prueft, dass angeforderte Gesundheitsrechte wirklich gebraucht werden: nur Schritte, Gewicht, Workouts
      - name: Pruefung Gesundheitsrechte (nur Schritte, Gewicht, Workouts)
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions frontend/android/app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          HEALTH=$(grep -o "android.permission.health.[A-Z_]*" perms.txt | sort -u | tr '\n' ' ')
          echo "Gesundheitsrechte: $HEALTH"
          [ "$HEALTH" = "android.permission.health.READ_EXERCISE android.permission.health.READ_STEPS android.permission.health.READ_WEIGHT " ]

      - name: Pruefung Alarm-Recht (kein SCHEDULE_EXACT_ALARM)
        run: "! grep -q SCHEDULE_EXACT_ALARM perms.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ASFIT-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
