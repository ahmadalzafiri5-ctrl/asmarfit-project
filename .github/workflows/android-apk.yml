# Baut bei jeder Aenderung an der App automatisch die Android-App (APK).
# Ergebnis: Actions -> (Lauf anklicken) -> unten "Artifacts" -> ASFIT-android-apk
#
# Damit sich eine neue APK ueber die alte installieren laesst (ohne Deinstallieren, Daten bleiben),
# muss sie mit demselben Schluessel signiert sein. Dafuer einmal das Secret DEBUG_KEYSTORE_BASE64 anlegen
# (Anleitung steht in frontend/ANDROID-UPDATES.md). Ohne das Secret baut der Lauf trotzdem, aber mit
# einem frischen Schluessel pro Lauf: dann die alte App vorher deinstallieren.
name: Android-App bauen

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/basics.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Der Android-SDK ist auf den GitHub-Rechnern schon installiert; hier nur die Lizenzen bestaetigen
      - name: Android-SDK pruefen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Web-App bauen und in das Android-Projekt kopieren
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Feste Signatur einsetzen (wenn das Secret vorhanden ist)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Feste Signatur aus dem Secret wird verwendet."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 fehlt: die APK bekommt einen neuen Schluessel und laesst sich nicht ueber eine schon installierte App spielen."
          fi

      - name: Versionsnummer hochzaehlen
        run: |
          echo "ASFIT_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ASFIT_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ASFIT-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
