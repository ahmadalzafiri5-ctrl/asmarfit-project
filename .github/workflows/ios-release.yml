# Baut die iOS-App (Store-Variante, ohne Einnahme-Tagebuch) auf einem macOS-Runner und laedt sie
# direkt zu App Store Connect / TestFlight hoch. Signierung laeuft automatisch ueber den
# App-Store-Connect-API-Schluessel (Cloud Signing) — kein eigener Mac und kein Zertifikats-Export noetig.
#
# Voraussetzungen (einmalig):
#   1. Apple-Developer-Konto aktiv und die App in App Store Connect angelegt (Bundle-ID com.asfit.app)
#   2. API-Schluessel unter https://appstoreconnect.apple.com/access/integrations/api erstellen
#      (Rolle "App-Manager"), die .p8-Datei herunterladen
#   3. GitHub-Secrets setzen:
#        ASC_KEY_ID      die Schluessel-ID (z.B. 2X9R4HXF34)
#        ASC_ISSUER_ID   die Issuer-ID (UUID oben auf der API-Seite)
#        ASC_KEY_P8      der komplette Inhalt der .p8-Datei (mehrzeilig, inkl. BEGIN/END-Zeilen)
#        APPLE_TEAM_ID   die Team-ID (developer.apple.com -> Membership, z.B. ABCDE12345)
name: iOS-TestFlight-Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versionsname im Store (leer = Standard unten)"
        type: string
        default: ""
  push:
    branches: [master]
    paths:
      - ".github/workflows/ios-release.yml"

concurrency:
  group: ios-release
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15-intel  # arm64-Macs bei GitHub oft ueberlastet ("not acquired by Runner")
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web-App bauen (Store-Variante) und in das iOS-Projekt kopieren
        working-directory: frontend
        env:
          VITE_INTAKE_SAFE: "1"
        run: |
          npm ci
          npm run build
          # Uebungs-Demos (~71 MB) nicht buendeln — die native App laedt sie vom Server
          rm -rf dist/gifs
          npx cap sync ios

      - name: API-Schluessel pruefen und ablegen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID fehlen — Anleitung oben im Workflow."
            exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_$ASC_KEY_ID.p8 || { echo "::error::ASC_KEY_P8 sieht nicht wie eine .p8-Datei aus (BEGIN PRIVATE KEY fehlt)."; exit 1; }

      - name: Versionsnummern setzen
        working-directory: frontend/ios/App
        run: |
          NAME="${{ inputs.version_name }}"
          /usr/libexec/PlistBuddy -c "Print" App/Info.plist > /dev/null
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${NAME:-1.0.30};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" App.xcodeproj/project.pbxproj
          grep -m2 "MARKETING_VERSION\|CURRENT_PROJECT_VERSION" App.xcodeproj/project.pbxproj

      - name: Neuestes Xcode waehlen (Apple verlangt das iOS-26-SDK fuer Uploads)
        run: |
          ls -d /Applications/Xcode*.app
          # bewusst Xcode 26 (stabil) — eine evtl. installierte Xcode-27-BETA lehnt Apple beim Upload ab
          NEU=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Gewaehlt: $NEU"
          sudo xcode-select -s "$NEU"
          xcodebuild -version

      - name: Archiv bauen (automatische Cloud-Signierung)
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # AD-HOC signieren statt gar nicht: braucht weiterhin kein Geraet und kein Profil,
          # aber die Entitlements (HealthKit!) werden ins Binary eingebacken — mit
          # CODE_SIGNING_ALLOWED=NO gingen sie verloren und Apple Health konnte nie verbinden.
          # Die richtige App-Store-Signierung passiert wie gehabt erst beim Export.
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: Zu TestFlight hochladen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Erst in eine IPA exportieren (statt Direkt-Upload), damit wir die Entitlements
          # pruefen koennen — der HealthKit-Anspruch ging sonst unbemerkt verloren.
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "IPA: $IPA"

          # Entitlements der fertig signierten App ausgeben und HealthKit erzwingen
          mkdir -p "$RUNNER_TEMP/ipa-check" && cd "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA"
          APP=$(ls -d Payload/*.app | head -1)
          echo "--- Entitlements der signierten App ---"
          codesign -d --entitlements :- "$APP" | tee entitlements.txt || true
          if ! grep -q "com.apple.developer.healthkit" entitlements.txt; then
            echo "::error::HealthKit-Entitlement FEHLT in der signierten App — Apple Health kann so nie verbinden."
            exit 1
          fi
          echo "HealthKit-Entitlement vorhanden."

      - name: Zu App Store Connect hochladen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Zweiter Export mit Direkt-Upload (gleiches Archiv, gleiche Signierung)
          cat > "$RUNNER_TEMP/upload.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Hochgeladen — der Build erscheint in App Store Connect unter TestFlight (Verarbeitung dauert 5-30 Min)."

